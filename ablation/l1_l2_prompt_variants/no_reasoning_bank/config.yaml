# Variant 1: B-L1 with NO language-specific reasoning bank.
#
# Identical to canonical config_b_l1.yaml. The reasoning-bank section is
# stripped at runtime by ablation/l1_l2_prompt_variants/no_reasoning_bank/scripts/run.py,
# which monkey-patches build_cot_block() to return the CoT block WITHOUT the
# language_guidance lines (but WITH the decision policy and the bare CoT
# instruction).
#
# Tests: how much of B-L1's per-language F1 comes from the reasoning bank?
# Mirrors A7's analogous test on B-L3, but for L1.

topology: "width"
level: "l1"
num_agents: 3

sampling:
  temperature: 0.7
  top_p: 0.95

max_tokens: 512

aggregation:
  primary: "majority_vote"
  secondary: "confidence_weighted"
  majority_threshold: 2
  confidence_threshold: 0.5

agents:
  - name: "agent_1"
    seed: 42
    bias: ""
  - name: "agent_2"
    seed: 123
    bias: ""
  - name: "agent_3"
    seed: 456
    bias: ""
